<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merchant sign in - ISB</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon-16.svg') }}" sizes="16x16">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("isb-theme") || "light");</script>
</head>
<body class="auth-page auth-merchant">
    <a href="#merchantLoginForm" class="skip-link">Skip to merchant sign in</a>

    <div class="auth-brand guilloche">
        <div class="auth-brand-content">
            <div class="brand-logo">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 12 16 5l12 7z"></path><path d="M8 15v9M16 15v9M24 15v9"></path><path d="M4 27h24"></path></svg>
                <span class="brand-logo-text">ISB</span><span class="brand-logo-sub">Merchant</span>
            </div>
            <h2>Accept card payments.</h2>
            <p>ISB Merchant gives your business an API key, a payments ledger and card charges in one console.</p>
        </div>
    </div>

    <main class="auth-form-panel">
        <div class="auth-form-container">
            <h1>Merchant sign in</h1>
            <p class="auth-subtitle">Sign in to the ISB Merchant console.</p>

            <div id="merchantAuthMessage"></div>

            <form id="merchantLoginForm">
                <div class="auth-input-group">
                    <label for="email">Email</label>
                    <div class="auth-field">
                        <input type="email" name="email" id="email" required autocomplete="email">
                        <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
                    </div>
                </div>
                <div class="auth-input-group">
                    <label for="password">Password</label>
                    <div class="auth-field">
                        <input type="password" name="password" id="password" required autocomplete="current-password">
                        <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                </div>
                <button type="submit">Sign in</button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('merchant_register_page') }}">Open a merchant account</a>
                <a href="{{ url_for('login') }}">Personal banking sign in</a>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='merchant.js') }}"></script>
</body>
</html>
