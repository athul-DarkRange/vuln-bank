<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in - ISB</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon-16.svg') }}" sizes="16x16">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("isb-theme") || "light");</script>
</head>
<body class="auth-page">
    <a href="#loginForm" class="skip-link">Skip to sign in form</a>

    <div class="auth-brand guilloche">
        <div class="auth-brand-content">
            <div class="brand-logo">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 12 16 5l12 7z"></path><path d="M8 15v9M16 15v9M24 15v9"></path><path d="M4 27h24"></path></svg>
                <span class="brand-logo-text">ISB</span>
            </div>
            <h2>Your money, in one place.</h2>
            <p>Check balances, send transfers and manage your cards from any device.</p>
        </div>
    </div>

    <main class="auth-form-panel">
        <div class="auth-form-container">
            <h1>Welcome back</h1>
            <p class="auth-subtitle">Sign in to your account to continue.</p>

            <div id="message"></div>

            <form id="loginForm">
                <div class="auth-input-group">
                    <label for="username">Username</label>
                    <div class="auth-field">
                        <input type="text" name="username" id="username" required autocomplete="username">
                        <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                </div>
                <div class="auth-input-group">
                    <label for="password">Password</label>
                    <div class="auth-field">
                        <input type="password" name="password" id="password" required autocomplete="current-password">
                        <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                </div>
                <button type="submit">Sign in</button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('register') }}">Don't have an account? Open one</a>
                <a href="{{ url_for('forgot_password') }}">Forgot your password?</a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loginForm').addEventListener('submit', async (event) => {
                event.preventDefault();

                const formData = new FormData(event.target);
                const jsonData = {};
                formData.forEach((value, key) => jsonData[key] = value);

                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(jsonData)
                    });

                    const data = await response.json();

                    if (data.status === 'success' && data.token) {
                        localStorage.setItem('jwt_token', data.token);
                        window.location.href = '/dashboard';
                    } else {
                        document.getElementById('message').innerHTML = data.message || 'Login failed';
                        document.getElementById('message').style.color = '';
                        document.getElementById('message').className = 'error';
                    }
                } catch (error) {
                    document.getElementById('message').innerHTML = 'Login failed. Please try again.';
                    document.getElementById('message').style.color = '';
                    document.getElementById('message').className = 'error';
                }
            });
        });
    </script>
</body>
</html>
