<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot password - ISB</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon-16.svg') }}" sizes="16x16">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("isb-theme") || "light");</script>
</head>
<body class="auth-page">
    <a href="#forgotForm" class="skip-link">Skip to reset request form</a>

    <div class="auth-brand guilloche">
        <div class="auth-brand-content">
            <div class="brand-logo">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 12 16 5l12 7z"></path><path d="M8 15v9M16 15v9M24 15v9"></path><path d="M4 27h24"></path></svg>
                <span class="brand-logo-text">ISB</span>
            </div>
            <h2>Locked out?</h2>
            <p>Enter your username and we will issue a reset PIN so you can set a new password.</p>
        </div>
    </div>

    <main class="auth-form-panel">
        <div class="auth-form-container">
            <h1>Reset your password</h1>
            <p class="auth-subtitle">Enter your username to receive a reset PIN.</p>

            <div id="message"></div>

            <form id="forgotForm">
                <div class="auth-input-group">
                    <label for="username">Username</label>
                    <div class="auth-field">
                        <input type="text" name="username" id="username" required autocomplete="username">
                        <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                </div>
                <button type="submit">Request reset PIN</button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('login') }}">Back to sign in</a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('forgotForm').addEventListener('submit', async (event) => {
                event.preventDefault();
                const formData = new FormData(event.target);
                const jsonData = {};
                formData.forEach((value, key) => jsonData[key] = value);

                try {
                    const response = await fetch('/api/v3/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(jsonData)
                    });
                    const data = await response.json();
                    document.getElementById('message').innerHTML = data.message;
                    document.getElementById('message').className = data.status === 'success' ? 'success' : 'error';
                    if (data.status === 'success') {
                        setTimeout(() => {
                            window.location.href = '/reset-password';
                        }, 2000);
                    }
                } catch (error) {
                    document.getElementById('message').innerHTML = 'Request failed. Please try again.';
                    document.getElementById('message').className = 'error';
                }
            });
        });
    </script>
</body>
</html>
